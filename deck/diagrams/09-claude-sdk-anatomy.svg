<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" role="img" aria-label="How the platform is designed around the Claude Agent SDK: the adapter boundary, the exact query options, and the four gotchas">
<style>
  .bg{fill:#ffffff}.band{fill:#f4f6fa;stroke:#dde3ec}.box{fill:#ffffff;stroke:#c3ccda}
  .accentbox{fill:#fff4ec;stroke:#ff7a29}.aibox{fill:#eef6ff;stroke:#4da3ff}
  .okbox{fill:#eefaf3;stroke:#3ddc97}.badbox{fill:#fdeeee;stroke:#e05555}
  .code{fill:#0f1522;stroke:#2c3646}
  .t{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#111827}
  .mut{fill:#5b6577}.kick{fill:#ff7a29;font-weight:700;letter-spacing:.14em}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace}
  .ct{fill:#c9d3e2;font-family:"SF Mono",Menlo,Consolas,monospace}
  .ckey{fill:#79b8ff}.cstr{fill:#9ae6b4}.ccom{fill:#6b7688}
  .arrow{stroke:#8b95a7;fill:none;stroke-width:1.6}.ah{fill:#8b95a7}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0c1017}.band{fill:#131924;stroke:#242c3a}.box{fill:#171e2a;stroke:#2c3646}
    .accentbox{fill:#2a1a10;stroke:#ff7a29}.aibox{fill:#10203a;stroke:#4da3ff}
    .okbox{fill:#0f2a1f;stroke:#3ddc97}.badbox{fill:#2c1414;stroke:#e05555}
    .t{fill:#e8eaf0}.mut{fill:#9aa3b2}.arrow{stroke:#6b7688}.ah{fill:#6b7688}
  }
.bg{fill:#0c1017}.band{fill:#131924;stroke:#242c3a}.box{fill:#171e2a;stroke:#2c3646}
    .accentbox{fill:#2a1a10;stroke:#ff7a29}.aibox{fill:#10203a;stroke:#4da3ff}
    .okbox{fill:#0f2a1f;stroke:#3ddc97}.badbox{fill:#2c1414;stroke:#e05555}
    .t{fill:#e8eaf0}.mut{fill:#9aa3b2}.arrow{stroke:#6b7688}.ah{fill:#6b7688}
</style>
<rect class="bg" width="1240" height="900"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>

<text class="t kick" x="40" y="40" font-size="13">DESIGNED AROUND THE CLAUDE AGENT SDK — THE ADAPTER BOUNDARY</text>
<text class="t mut" x="40" y="64" font-size="13">We adopted the runtime instead of hand-rolling an agent loop. The engineering value is the boundary we drew around it.</text>

<!-- boundary -->
<rect class="band" x="40" y="86" width="1160" height="126" rx="12"/>
<text class="t kick" x="60" y="112" font-size="11">THE RULE THAT MAKES THE SDK REPLACEABLE</text>
<rect class="accentbox" x="60" y="122" width="546" height="76" rx="8"/>
<text class="t" x="76" y="146" font-size="14" font-weight="700"><tspan class="mono">runtime.js</tspan> is the ONLY file importing the SDK</text>
<text class="t mut" x="76" y="168" font-size="11.5">SDK types may not appear in stores, hooks, the tool server, or <tspan class="mono">@syntell/ai-core</tspan>.</text>
<text class="t mut" x="76" y="186" font-size="11.5">The SDK's <tspan class="mono">tool()</tspan> and <tspan class="mono">createSdkMcpServer()</tspan> are <tspan font-weight="700">injected</tspan> into the tool server, not imported by it.</text>

<rect class="okbox" x="622" y="122" width="558" height="76" rx="8"/>
<text class="t" x="638" y="146" font-size="14" font-weight="700">Why it is worth the discipline</text>
<text class="t mut" x="638" y="168" font-size="11.5">Swapping runtimes later costs <tspan font-weight="700">~a week rewiring one file</tspan> — not months untangling</text>
<text class="t mut" x="638" y="186" font-size="11.5">SDK types out of every layer. Tests inject a fake async iterator; no network, no SDK.</text>

<!-- the seven steps -->
<rect class="band" x="40" y="228" width="470" height="300" rx="12"/>
<text class="t kick" x="60" y="254" font-size="11">ONE AGENT RUN — SEVEN STEPS</text>
<g font-size="11.5">
  <text class="t" x="60" y="280" font-weight="700">1</text><text class="t" x="82" y="280">Pre-flight quota check</text>
  <text class="t" x="60" y="308" font-weight="700">2</text><text class="t" x="82" y="308">Begin run — write a pending doc first</text>
  <text class="t" x="60" y="336" font-weight="700">3</text><text class="t" x="82" y="336">Build hooks (policy, citation, dataset, audit, cost)</text>
  <text class="t" x="60" y="364" font-weight="700">4</text><text class="t" x="82" y="364">Resolve + lock the tool surface</text>
  <text class="t" x="60" y="392" font-weight="700">5</text><text class="t" x="82" y="392">Build the in-process MCP server</text>
  <text class="t" x="60" y="420" font-weight="700">6</text><text class="t" x="82" y="420">Run via an <tspan font-weight="700">injectable</tspan> <tspan class="mono">sdkQuery</tspan></text>
  <text class="t" x="60" y="448" font-weight="700">7</text><text class="t" x="82" y="448">Complete run — validate the doc against the schema</text>
</g>
<rect class="box" x="60" y="464" width="430" height="52" rx="8"/>
<text class="t mut" x="74" y="486" font-size="11">The pending doc in step 2 matters: a run that dies mid-flight leaves</text>
<text class="t mut" x="74" y="502" font-size="11">evidence. Silence is never interpreted as success.</text>

<!-- the actual options -->
<rect class="band" x="530" y="228" width="670" height="300" rx="12"/>
<text class="t kick" x="550" y="254" font-size="11">THE ACTUAL QUERY OPTIONS (PRODUCTION)</text>
<rect class="code" x="550" y="264" width="630" height="248" rx="8"/>
<g class="ct" font-size="11.5">
  <text x="566" y="286"><tspan class="ckey">systemPrompt</tspan>: composeAgentRunSystemPrompt({ agentSystemPrompt })</text>
  <text x="566" y="306"><tspan class="ckey">model</tspan>: selectedModel        <tspan class="ccom">// admin policy → def.model → SDK default</tspan></text>
  <text x="566" y="326"><tspan class="ckey">disallowedTools</tspan>: buildDisallowedToolsList()   <tspan class="ccom">// all 19 built-ins</tspan></text>
  <text x="566" y="346"><tspan class="ckey">allowedTools</tspan>: allowedMcpNames  <tspan class="ccom">// mcp__syntell__{logical}</tspan></text>
  <text x="566" y="366"><tspan class="ckey">mcpServers</tspan>: { syntell: toolServerInstance }</text>
  <text x="566" y="386"><tspan class="ckey">permissionMode</tspan>: <tspan class="cstr">'dontAsk'</tspan>   <tspan class="ccom">// no human in a scheduled run</tspan></text>
  <text x="566" y="406"><tspan class="ckey">maxTurns</tspan>: def.quotas?.maxTurns ?? 16</text>
  <text x="566" y="426"><tspan class="ckey">abortController</tspan>: sdkAbortController</text>
  <text x="566" y="446"><tspan class="ckey">hooks</tspan>: {</text>
  <text x="566" y="464">  <tspan class="ckey">PreToolUse</tspan>:  [{ matcher: <tspan class="cstr">'.*'</tspan>, hooks: [policyGuard] }],</text>
  <text x="566" y="482">  <tspan class="ckey">PostToolUse</tspan>: [{ matcher: <tspan class="cstr">'.*'</tspan>, hooks: [citation, dataset, audit] }],</text>
  <text x="566" y="500">  <tspan class="ckey">Stop</tspan>:        [{ matcher: <tspan class="cstr">'.*'</tspan>, hooks: [cost] }] }</text>
</g>

<!-- four gotchas -->
<rect class="band" x="40" y="544" width="1160" height="196" rx="12"/>
<text class="t kick" x="60" y="570" font-size="11">FOUR SDK GOTCHAS THAT COST REAL DAYS — AND HOW EACH SURFACED</text>
<g font-size="11.5">
  <rect class="badbox" x="60" y="582" width="270" height="140" rx="8"/>
  <text class="t" x="74" y="604" font-weight="700"><tspan class="mono">tools: []</tspan> silently disables</text>
  <text class="t" x="74" y="620" font-weight="700">ALL tools</text>
  <text class="t mut" x="74" y="642">Including MCP ones. <tspan font-weight="700">Omit the key</tspan></text>
  <text class="t mut" x="74" y="658">entirely instead.</text>
  <text class="t mut" x="74" y="682">Symptom: the model emitted</text>
  <text class="t mut mono" x="74" y="698">{"name":"list_capabilities"}</text>
  <text class="t mut" x="74" y="714">as raw text, not a tool_use block.</text>

  <rect class="badbox" x="342" y="582" width="270" height="140" rx="8"/>
  <text class="t" x="356" y="604" font-weight="700"><tspan class="mono">alwaysLoad: true</tspan> is required</text>
  <text class="t mut" x="356" y="626">Without it, MCP tools hide behind</text>
  <text class="t mut" x="356" y="642">the SDK's built-in ToolSearch and</text>
  <text class="t mut" x="356" y="658">the model never sees them.</text>
  <text class="t mut" x="356" y="682">A tool that exists but is invisible</text>
  <text class="t mut" x="356" y="698">looks exactly like a tool that is</text>
  <text class="t mut" x="356" y="714">broken.</text>

  <rect class="badbox" x="624" y="582" width="270" height="140" rx="8"/>
  <text class="t" x="638" y="604" font-weight="700"><tspan class="mono">tool_response</tspan> is a JSON</text>
  <text class="t" x="638" y="620" font-weight="700">STRING, not an object</text>
  <text class="t mut" x="638" y="642">Parse before probing it in a</text>
  <text class="t mut" x="638" y="658">PostToolUse hook.</text>
  <text class="t mut" x="638" y="682">This one shipped a citation</text>
  <text class="t mut" x="638" y="698">extractor that silently found</text>
  <text class="t mut" x="638" y="714">zero citations.</text>

  <rect class="badbox" x="906" y="582" width="274" height="140" rx="8"/>
  <text class="t" x="920" y="604" font-weight="700"><tspan class="mono">console.log</tspan> from a hook</text>
  <text class="t" x="920" y="620" font-weight="700">never reaches stdout</text>
  <text class="t mut" x="920" y="642">Emit to the operational log</text>
  <text class="t mut" x="920" y="658">instead.</text>
  <text class="t mut" x="920" y="682">Debugging a hook you cannot</text>
  <text class="t mut" x="920" y="698">see is how you lose an</text>
  <text class="t mut" x="920" y="714">afternoon.</text>
</g>

<!-- one truth layer -->
<rect class="accentbox" x="40" y="756" width="1160" height="120" rx="12"/>
<text class="t kick" x="60" y="782" font-size="11">ONE TRUTH LAYER, TWO SURFACES</text>
<text class="t" x="60" y="808" font-size="13.5" font-weight="700">The agent's system prompt is composed from the SAME exported blocks as the chat prompt — so drift is structurally impossible, not a discipline problem.</text>
<text class="t mut" x="60" y="832" font-size="12">Company context · data-worlds dictionary · reference-resolution discipline · actuals-routing and methodology anchors. Editing one shared block updates both surfaces at once.</text>
<text class="t mut" x="60" y="852" font-size="12">It is <tspan font-weight="700">runtime-composed and never persisted</tspan>: existing agent definitions inherit an improved grounding with no document migration, and no customer-authored brief is ever rewritten.</text>
<text class="t mut" x="60" y="870" font-size="12">Chat-only material (page awareness, UI context, follow-up framing) is deliberately absent — a scheduled report has no user to ask and no page to look at.</text>
</svg>

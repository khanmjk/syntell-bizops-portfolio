<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" role="img" aria-label="Agent framework runtime: Claude Agent SDK adapter, in-process MCP tool server, hooks, stores and scheduler">
<style>
  .bg{fill:#ffffff}
  .band{fill:#f4f6fa;stroke:#dde3ec}
  .box{fill:#ffffff;stroke:#c3ccda}
  .accentbox{fill:#fff4ec;stroke:#ff7a29}
  .aibox{fill:#eef6ff;stroke:#4da3ff}
  .okbox{fill:#eefaf3;stroke:#3ddc97}
  .badbox{fill:#fdeeee;stroke:#e05555}
  .t{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#111827}
  .mut{fill:#5b6577}
  .kick{fill:#ff7a29;font-weight:700;letter-spacing:.14em}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace}
  .arrow{stroke:#8b95a7;fill:none;stroke-width:1.6}
  .ah{fill:#8b95a7}
  .num{fill:#ff7a29;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0c1017}.band{fill:#131924;stroke:#242c3a}.box{fill:#171e2a;stroke:#2c3646}
    .accentbox{fill:#2a1a10;stroke:#ff7a29}.aibox{fill:#10203a;stroke:#4da3ff}
    .okbox{fill:#0f2a1f;stroke:#3ddc97}.badbox{fill:#2c1414;stroke:#e05555}
    .t{fill:#e8eaf0}.mut{fill:#9aa3b2}.arrow{stroke:#6b7688}.ah{fill:#6b7688}
  }
.bg{fill:#0c1017}.band{fill:#131924;stroke:#242c3a}.box{fill:#171e2a;stroke:#2c3646}
    .accentbox{fill:#2a1a10;stroke:#ff7a29}.aibox{fill:#10203a;stroke:#4da3ff}
    .okbox{fill:#0f2a1f;stroke:#3ddc97}.badbox{fill:#2c1414;stroke:#e05555}
    .t{fill:#e8eaf0}.mut{fill:#9aa3b2}.arrow{stroke:#6b7688}.ah{fill:#6b7688}
</style>
<rect class="bg" width="1240" height="900"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>

<text class="t kick" x="40" y="40" font-size="13">AGENT FRAMEWORK — WHAT WE BUILT AROUND THE SDK</text>
<text class="t mut" x="40" y="64" font-size="13">The runtime is Anthropic's. The platform — persistence, policy, citations, quotas, scheduling, validation — is the engineering value.</text>

<!-- triggers -->
<rect class="band" x="40" y="86" width="250" height="188" rx="12"/>
<text class="t kick" x="58" y="112" font-size="11">TRIGGERS</text>
<rect class="box" x="58" y="122" width="214" height="42" rx="7"/>
<text class="t" x="70" y="140" font-size="12.5" font-weight="700">Scheduled</text>
<text class="t mut" x="70" y="156" font-size="11">weekly · monthly · quarterly</text>
<rect class="box" x="58" y="170" width="214" height="42" rx="7"/>
<text class="t" x="70" y="188" font-size="12.5" font-weight="700">Ad-hoc "Run now"</text>
<text class="t mut" x="70" y="204" font-size="11">any authenticated BU user</text>
<rect class="box" x="58" y="218" width="214" height="42" rx="7"/>
<text class="t" x="70" y="236" font-size="12.5" font-weight="700">Composer dry-run</text>
<text class="t mut" x="70" y="252" font-size="11">the real runtime, not a mock</text>

<path class="arrow" marker-end="url(#a)" d="M290 180 L336 180"/>

<!-- runtime.js -->
<rect class="accentbox" x="342" y="86" width="470" height="188" rx="12"/>
<text class="t kick" x="362" y="112" font-size="11">runtime.js — THE ONLY SDK IMPORT IN THE CODEBASE</text>
<text class="t mut" x="362" y="134" font-size="11.5">SDK types must never leak into stores, hooks, the tool server or ai-core.</text>
<text class="t mut" x="362" y="150" font-size="11.5">Swapping runtimes later = one week rewiring one file, not months untangling.</text>
<g font-size="11.5">
  <text class="t num" x="362" y="176">1</text><text class="t" x="380" y="176">Pre-flight quota check</text>
  <text class="t num" x="362" y="196">2</text><text class="t" x="380" y="196">Begin run — write pending doc</text>
  <text class="t num" x="362" y="216">3</text><text class="t" x="380" y="216">Build hooks</text>
  <text class="t num" x="600" y="176">4</text><text class="t" x="618" y="176">Resolve + lock tool surface</text>
  <text class="t num" x="600" y="196">5</text><text class="t" x="618" y="196">Build in-process MCP server</text>
  <text class="t num" x="600" y="216">6</text><text class="t" x="618" y="216">Run via injectable <tspan class="mono">sdkQuery</tspan></text>
  <text class="t num" x="600" y="236">7</text><text class="t" x="618" y="236">Complete run — validate doc</text>
</g>
<text class="t mut" x="362" y="258" font-size="11">Tests inject a fake async iterator that drives tool_use → tool_result → assistant text → result.</text>

<path class="arrow" marker-end="url(#a)" d="M812 180 L858 180"/>

<!-- tool surface lockdown -->
<rect class="badbox" x="864" y="86" width="336" height="188" rx="12"/>
<text class="t kick" x="882" y="112" font-size="11">TOOL-SURFACE LOCKDOWN</text>
<text class="t" x="882" y="136" font-size="12.5" font-weight="700">allowedTools is an APPROVAL gate,</text>
<text class="t" x="882" y="154" font-size="12.5" font-weight="700">not a VISIBILITY gate.</text>
<text class="t mut" x="882" y="178" font-size="11.5">So the runtime also populates <tspan class="mono">disallowedTools</tspan></text>
<text class="t mut" x="882" y="194" font-size="11.5">with the full SDK built-in list as defence in depth:</text>
<text class="t mut mono" x="882" y="214" font-size="11">Read · Write · Edit · Bash · Glob · Grep</text>
<text class="t mut mono" x="882" y="230" font-size="11">WebSearch · WebFetch · Task · NotebookEdit …</text>
<text class="t" x="882" y="254" font-size="11.5" font-weight="700">A finance agent cannot read the filesystem</text>
<text class="t" x="882" y="268" font-size="11.5" font-weight="700">or reach the internet — by construction.</text>

<!-- MCP tool server -->
<rect class="band" x="40" y="290" width="580" height="212" rx="12"/>
<text class="t kick" x="60" y="316" font-size="11">IN-PROCESS MCP TOOL SERVER — 75 CAPABILITIES</text>
<text class="t mut" x="60" y="336" font-size="11.5">Definitions store LOGICAL names; the runtime resolves each to <tspan class="mono">mcp__syntell__{name}</tspan>.</text>
<g font-size="11.5">
  <rect class="aibox" x="60" y="348" width="266" height="42" rx="7"/><text class="t" x="72" y="366" font-weight="700">build_movement_pack</text><text class="t mut" x="72" y="382">the canonical "what changed" tool</text>
  <rect class="aibox" x="336" y="348" width="266" height="42" rx="7"/><text class="t" x="348" y="366" font-weight="700">compute_plan_vs_actual</text><text class="t mut" x="348" y="382">plan · actual · prior year</text>
  <rect class="aibox" x="60" y="398" width="266" height="42" rx="7"/><text class="t" x="72" y="416" font-weight="700">compute_customer_health_composite</text><text class="t mut" x="72" y="432">at-risk ranking across 4 connectors</text>
  <rect class="aibox" x="336" y="398" width="266" height="42" rx="7"/><text class="t" x="348" y="416" font-weight="700">compute_period_aggregate</text><text class="t mut" x="348" y="432">weekly → month / quarter / YoY</text>
  <rect class="box" x="60" y="448" width="542" height="42" rx="7"/><text class="t" x="72" y="466" font-weight="700">+ bridged AI-chat tools (agent-only)</text><text class="t mut" x="72" y="482">FinPack, SAP analytics, insight catalog — the same handlers the copilot uses, so agents and chat can never disagree</text>
</g>

<!-- hooks -->
<rect class="band" x="632" y="290" width="568" height="212" rx="12"/>
<text class="t kick" x="652" y="316" font-size="11">HOOKS — WHERE POLICY IS ACTUALLY ENFORCED</text>
<g font-size="11.5">
  <rect class="badbox" x="652" y="330" width="528" height="40" rx="7"/>
  <text class="t" x="664" y="348" font-weight="700">policyGuard <tspan class="mut" font-weight="400">· PreToolUse</tspan></text>
  <text class="t mut" x="664" y="364">BU AI Data Policy · cross-BU block · opt-in per-user ABAC on tool args</text>
  <rect class="okbox" x="652" y="378" width="528" height="40" rx="7"/>
  <text class="t" x="664" y="396" font-weight="700">citationExtractor <tspan class="mut" font-weight="400">· PostToolUse</tspan></text>
  <text class="t mut" x="664" y="412">pulls citations out of tool RETURNS — never parsed from the model's prose</text>
  <rect class="box" x="652" y="426" width="258" height="40" rx="7"/>
  <text class="t" x="664" y="444" font-weight="700">datasetExtractor</text><text class="t mut" x="664" y="460">binds charts to real rows</text>
  <rect class="box" x="920" y="426" width="260" height="40" rx="7"/>
  <text class="t" x="932" y="444" font-weight="700">costTracker <tspan class="mut" font-weight="400">· Stop</tspan></text><text class="t mut" x="932" y="460">token aggregation · quota check</text>
  <rect class="box" x="652" y="474" width="528" height="20" rx="5"/>
  <text class="t mut" x="664" y="489">auditLog · PostToolUse → operational-log event: who created / ran / changed / scheduled what</text>
</g>

<text class="t" x="640" y="524" font-size="12.5" font-weight="700">The SDK can block a tool CALL. It cannot filter a tool's OUTPUT.</text>
<text class="t mut" x="640" y="542" font-size="12">That is why the data policy lives in the handler, not the prompt. Anything enforced only in a system prompt is a suggestion.</text>

<!-- stores -->
<rect class="band" x="40" y="560" width="580" height="150" rx="12"/>
<text class="t kick" x="60" y="586" font-size="11">COSMOS PERSISTENCE — 8 STORES</text>
<g font-size="11">
  <rect class="box" x="60" y="596" width="130" height="34" rx="6"/><text class="t" x="70" y="617" font-weight="700">definitionStore</text>
  <rect class="box" x="198" y="596" width="130" height="34" rx="6"/><text class="t" x="208" y="617" font-weight="700">runStore</text>
  <rect class="box" x="336" y="596" width="130" height="34" rx="6"/><text class="t" x="346" y="617" font-weight="700">policyStore</text>
  <rect class="box" x="474" y="596" width="128" height="34" rx="6"/><text class="t" x="484" y="617" font-weight="700">costCounterStore</text>
  <rect class="box" x="60" y="638" width="130" height="34" rx="6"/><text class="t" x="70" y="659" font-weight="700">leaseStore</text>
  <rect class="box" x="198" y="638" width="130" height="34" rx="6"/><text class="t" x="208" y="659" font-weight="700">heartbeatStore</text>
  <rect class="box" x="336" y="638" width="130" height="34" rx="6"/><text class="t" x="346" y="659" font-weight="700">runtimeStateStore</text>
  <rect class="box" x="474" y="638" width="128" height="34" rx="6"/><text class="t" x="484" y="659" font-weight="700">userReportSeen</text>
</g>
<text class="t mut" x="60" y="694" font-size="11.5">Agents are typed Cosmos documents (<tspan class="mono">AgentDefinitionV1</tspan>), not hardcoded prompts — so they can be browsed, cloned and remixed.</text>

<!-- validation + output -->
<rect class="band" x="632" y="560" width="568" height="150" rx="12"/>
<text class="t kick" x="652" y="586" font-size="11">BEFORE ANYTHING REACHES AN INBOX</text>
<rect class="okbox" x="652" y="596" width="528" height="46" rx="7"/>
<text class="t" x="664" y="616" font-size="12.5" font-weight="700">Validation oracle — an independent second opinion</text>
<text class="t mut" x="664" y="633" font-size="11">The mature chat runtime, in a server-only profile, grades the MCP-generated report for grounding, scope and publishability. Strict JSON, never prose.</text>
<rect class="box" x="652" y="650" width="258" height="44" rx="7"/>
<text class="t" x="664" y="670" font-size="12.5" font-weight="700">Pass → Filed Reports</text>
<text class="t mut" x="664" y="686" font-size="11">badged Succeeded + Validated</text>
<rect class="badbox" x="920" y="650" width="260" height="44" rx="7"/>
<text class="t" x="932" y="670" font-size="12.5" font-weight="700">Fail → Needs Review</text>
<text class="t mut" x="932" y="686" font-size="11">quarantined, never auto-published</text>

<path class="arrow" marker-end="url(#a)" d="M620 730 L620 764"/>

<!-- principle -->
<rect class="accentbox" x="40" y="768" width="1160" height="100" rx="12"/>
<text class="t kick" x="60" y="794" font-size="11">THE DIVISION OF LABOUR</text>
<text class="t" x="60" y="820" font-size="13.5" font-weight="700">Deterministic code decides what is true and who may see it. The model decides how to say it.</text>
<text class="t mut" x="60" y="844" font-size="12">Ranking, materiality thresholds, scope filtering, identity resolution and citation binding are all code. The agent receives a typed, ranked, already-scoped</text>
<text class="t mut" x="60" y="860" font-size="12">list with citations attached — and writes prose about it. It never decides what counts as important, and it never performs the access-control filtering.</text>
</svg>
